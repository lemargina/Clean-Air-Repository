name: clean-air
x-app: &app
 build: .
 image: clean-air-local
 env_file: .env.docker
 environment:
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: air
  DB_USERNAME: air
  CACHE_STORE: database
  SESSION_DRIVER: file
  QUEUE_CONNECTION: database
  DB_QUEUE_RETRY_AFTER: 22000
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  APP_DEBUG: "false"
 volumes:
  - air_storage:/var/www/html/storage
 depends_on:
  db:
   condition: service_healthy
services:
 db:
  image: postgres:17-alpine
  env_file: .env.docker
  environment:
   POSTGRES_DB: air
   POSTGRES_USER: air
  volumes: ["air_db:/var/lib/postgresql/data"]
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U air -d air"]
   interval: 5s
   timeout: 3s
   retries: 20
 app:
  <<: *app
  healthcheck:
   test: ["CMD", "php", "artisan", "air:check-infrastructure"]
   interval: 30s
   timeout: 10s
   retries: 3
 init:
  <<: *app
  command: ["sh", "-c", "php artisan migrate --force && php artisan air:geo-import"]
  restart: "no"
 web:
  image: nginx:1.28-alpine
  ports: ["127.0.0.1:8080:80"]
  volumes:
   - ./public:/var/www/html/public:ro
   - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  depends_on:
   app: {condition: service_healthy}
   init: {condition: service_completed_successfully}
  healthcheck:
   test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"]
   interval: 30s
 scheduler:
  <<: *app
  command: ["php", "artisan", "schedule:work"]
  restart: unless-stopped
  depends_on:
   init: {condition: service_completed_successfully}
 worker:
  <<: *app
  command: ["php", "artisan", "queue:work", "--timeout=21600", "--tries=3", "--sleep=3", "--max-jobs=12"]
  restart: unless-stopped
  stop_grace_period: 60s
  depends_on:
   init: {condition: service_completed_successfully}
 prometheus:
  image: prom/prometheus:v3.5.0
  profiles: [monitoring]
  volumes:
   - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
   - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
   - ./.metrics-token:/etc/prometheus/metrics-token:ro
   - prometheus_data:/prometheus
  ports: ["127.0.0.1:9090:9090"]
  depends_on: [web]
 grafana:
  image: grafana/grafana:12.2.0
  profiles: [monitoring]
  env_file: .env.docker
  environment:
   GF_SECURITY_ADMIN_USER: admin
   GF_USERS_ALLOW_SIGN_UP: "false"
  ports: ["127.0.0.1:3000:3000"]
  volumes:
   - grafana_data:/var/lib/grafana
   - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
volumes:
 air_db:
 air_storage:
 prometheus_data:
 grafana_data:
